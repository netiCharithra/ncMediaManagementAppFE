<div class="category-page pb-5">
  <div class="container">
    <div class="category-header mb-4">
      <h1 class="fw-bold">{{ category | titlecase }}</h1>
      <div class="header-line"></div>
    </div>

    <div class="category-content" *ngIf="newsList.length > 0">
      <!-- Latest in Category: Hero Variant -->
      <div class="featured-news mb-4">
        <app-news-card [news]="newsList[0]" variant="hero"></app-news-card>
      </div>

      <!-- Rest of the news: Horizontal Variant for better scanning -->
      <div class="news-list-container">
        <div class="news-list-grid">
          <app-news-card *ngFor="let news of newsList.slice(1)" [news]="news" variant="horizontal">
          </app-news-card>
        </div>
      </div>
    </div>

    <!-- States remain same but with better styling -->
    <div *ngIf="pagination.loading" class="text-center mt-5">
      <div class="spinner-grow text-danger" role="status"></div>
      <p class="mt-3 text-muted fw-500">Curating more news...</p>
    </div>

    <div *ngIf="!pagination.loading && pagination.endOfRecords && newsList.length > 0" class="text-center mt-5">
      <div class="border-top pt-4">
        <p class="text-muted">You've reached the end of the {{ category }} section.</p>
        <a routerLink="/" class="btn btn-outline-danger btn-sm rounded-pill px-4">Return Home</a>
      </div>
    </div>

    <div *ngIf="!pagination.loading && newsList.length === 0" class="text-center mt-5">
      <div class="bg-light p-5 rounded-4">
        <i class="fa-solid fa-folder-open fa-3x text-muted mb-3"></i>
        <p class="h4 text-muted">No stories found in this section yet.</p>
      </div>
    </div>
  </div>
</div>
