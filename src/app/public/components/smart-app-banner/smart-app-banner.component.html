<div class="smart-banner" [class.show]="isVisible" [class.dev-mode]="isDevMode" *ngIf="isVisible">
  <div class="banner-content">
    <button class="close-btn" (click)="dismiss()" aria-label="Close banner">
      <i class="close-icon">✕</i>
    </button>

    <div class="app-info">
      <div class="app-logo">
        <img src="assets/images/logos/logo-512x512.png" [alt]="appTitle"
          onerror="this.src='https://via.placeholder.com/40'">
      </div>
      <div class="app-text">
        <div class="title-row">
          <span class="app-title">{{appTitle}}</span>
        </div>
        <div class="subtitle-row">
          <i class="fab" [class.fa-google-play]="platform === 'android'" [class.fa-apple]="platform === 'ios'"></i>
          <span class="app-subtitle">{{appSubtitle}}</span>
        </div>
      </div>
    </div>

    <div class="actions" [class.dual-actions]="isDesktop">
      <ng-container *ngIf="!isDesktop; else desktopActions">
        <button class="open-btn" (click)="openApp()">
          OPEN
        </button>
      </ng-container>

      <ng-template #desktopActions>
        <div class="desktop-store-btns">
          <a href="https://play.google.com/store/apps/details?id=com.ncmediauserapp" target="_blank" class="store-link">
            <i class="fab fa-google-play"></i>
          </a>
          <a href="https://apps.apple.com/app/id6443685250" target="_blank" class="store-link">
            <i class="fab fa-apple"></i>
          </a>
        </div>
      </ng-template>
    </div>
  </div>
</div>
