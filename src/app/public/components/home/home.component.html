<div class="home-container">

  <!-- Hero Section: Editorial Masthead -->
  <section class="news-section latest-news">
    <div class="container">
      <div class="section-header">
        <h2>{{languageService.getString('latestNews')}}</h2>
        <a routerLink="/latest-news" class="view-all">{{languageService.getString('viewAll')}} <i
            class="fa fa-chevron-right"></i></a>
      </div>

      <!-- Loading State -->
      <div class="skeleton-grid" *ngIf="isLoadingLatestNews">
        <div class="skeleton-card" *ngFor="let i of [1,2,3,4]"></div>
      </div>

      <!-- Content State -->
      <ng-container *ngIf="!isLoadingLatestNews && latestNews.length > 0">
        <div class="hero-layout-grid">
          <!-- Main Big Story -->
          <div class="main-story">
            <app-news-card [news]="latestNews[0]" variant="hero"></app-news-card>
          </div>

          <!-- Secondary Stories -->
          <div class="trending-sidebar">
            <app-news-card *ngFor="let news of latestNews.slice(1, 6)" [news]="news" variant="horizontal">
            </app-news-card>
          </div>
        </div>
      </ng-container>
    </div>
  </section>

  <!-- Dynamic Categories Sections -->
  <section class="news-section category-news" *ngFor="let section of categoryWiseNews; let i = index">
    <div class="container">
      <div class="section-header">
        <h2>{{section['type'][currentLanguage] || section['type']['value']}}</h2>
        <a [routerLink]="'/type/'+section['type']['value']"
          class="view-all">{{languageService.getString('viewAll')}}</a>
      </div>

      <!-- Alternating layouts for visual interest -->
      <div [class]="i % 2 === 0 ? 'news-grid' : 'mixed-feature-grid'" *ngIf="!isLoadingNewsTypes">
        <app-news-card *ngFor="let newsItem of section['records'].slice(0, 4)" [news]="newsItem"
          [variant]="i % 2 === 0 ? 'compact' : 'horizontal'">
        </app-news-card>
      </div>
    </div>
  </section>

  <!-- Categorised News -->
  <section class="news-section category-news" *ngFor="let section of categoryCategorisedNews; let i = index">
    <div class="container">
      <div class="section-header">
        <h2>{{getCategoryLabel(section['category'])}}</h2>
        <a [routerLink]="getCategorySlug(section['category'])"
          class="view-all">{{languageService.getString('viewAll')}}</a>
      </div>

      <div class="news-grid" *ngIf="!isLoadingNewsCategories">
        <app-news-card *ngFor="let newsItem of section['news'].slice(0, 4)" [news]="newsItem" variant="compact">
        </app-news-card>
      </div>
    </div>
  </section>

</div>
