<nav class="navbar-wrapper" [class.banner-visible]="isBannerVisible">
  <!-- Top Masthead Row: Brand + Secondary Actions -->
  <div class="masthead">
    <div class="container">
      <div class="masthead-content">
        <div class="date-info d-none d-lg-block">
          <span class="day">{{ today | date:'EEEE' }}</span>,
          <span class="date">{{ today | date:'MMM d, y' }}</span> |
          <span class="time">{{ today | date:'h:mm:ss a' }}</span>
        </div>

        <a class="brand-link" routerLink="/home">
          <img [src]="logoPath$ | async" alt="NC Media" class="brand-logo">
        </a>

        <div class="masthead-actions">
          <select (change)="switchLanguage($event)" class="language-select-minimal" [value]="currentLang$ | async">
            <option value="te">తెలుగు</option>
            <option value="en">English</option>
          </select>
          <button class="navbar-toggler-premium d-lg-none" (click)="toggleMenu()">
            <span class="toggler-bars"></span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation Row: Categories -->
  <div class="category-bar d-none d-lg-block">
    <div class="container">
      <ul class="nav-links">
        <li>
          <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">{{ getString('home')
            }}</a>
        </li>
        <li *ngFor="let category of NEWS_CATEGORIES_REGIONAL">
          <a [routerLink]="['/category', category.label]" routerLinkActive="active">
            {{ category[currentLanguage] || category.label }}
          </a>
        </li>
      </ul>
    </div>
  </div>

  <!-- Mobile Drawer -->
  <div class="mobile-drawer" [class.open]="!isMenuCollapsed">
    <div class="drawer-header">
      <img [src]="logoPath$ | async" alt="NC Media" class="mobile-logo">
      <button class="close-btn" (click)="toggleMenu()">&times;</button>
    </div>
    <ul class="mobile-nav-list">
      <li><a routerLink="/home" (click)="toggleMenu()">{{ getString('home') }}</a></li>
      <li *ngFor="let category of NEWS_CATEGORIES_REGIONAL">
        <a [routerLink]="['/category', category.label]" (click)="toggleMenu()">
          {{ category[currentLanguage] || category.label }}
        </a>
      </li>
    </ul>
  </div>
  <div class="drawer-overlay" *ngIf="!isMenuCollapsed" (click)="toggleMenu()"></div>
</nav>
