<div class="news-management">
    <app-admin-loader [show]="adminService.loaderService"></app-admin-loader>
    <app-page-header [title]="languageService.getString('employeeManagement') || 'Employee Management'"
        subtitle="Manage and view employee roles, tracking, and statuses." eyebrow="PEOPLE" eyebrowIcon="fas fa-users"
        class="mb-4 d-block">

        <div class="d-flex align-items-center gap-3">
            <!-- Filter Dropdown -->
            <div class="custom-select-wrapper" style="width: 180px;">
                <ng-select [(ngModel)]="employeeListData['action']" (change)="changeOfNewsType()" [searchable]="false"
                    [clearable]="false" class="enterprise-select">
                    <ng-option value="Active">Active Employees</ng-option>
                    <ng-option value="Inactive">Inactive Employees</ng-option>
                    <ng-option value="Disabled">Disabled Employees</ng-option>
                </ng-select>
            </div>

            <button class="btn btn-primary enterprise-btn" (click)="actionEmitter({type:'create'})">
                <i class="fas fa-plus mr-2"></i> Add Employee
            </button>
        </div>
    </app-page-header>

    <nc-web-paginated-table *ngIf="employeeListData.tableLoaded" [columns]="employeeListData.header"
        [data]="employeeListData.body" [page]="employeeListData.page" [itemsPerPage]="employeeListData.count"
        [totalItems]="employeeListData.totalNumberOfRecords" [metaData]="employeeListData.metaData"
        (pageChange)="onPageChangeRejectedNews($event)" (actionEmitter)="actionEmitter($event)"
        [noRecordsMessage]="'No Approved News available in records'"></nc-web-paginated-table>
</div>

<!-- Modal -->
<div class="modal fade" id="employeeFormModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
    aria-labelledby="staticBackdropLabel" aria-hidden="true">


    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="staticBackdropLabel">{{actionType === 'create' ? 'Create ' : actionType ===
                    'edit' ? 'Edit':''}} Employee</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form (ngSubmit)="disableFields ? signUpCreds() : signUpForm.form.valid && signUpCreds()"
                #signUpForm="ngForm" novalidate>
                <div class="modal-body p-4">
                    <div class="row g-3">

                        <div class="col-md-6">
                            <label class="form-label" for="loginName">Full Name</label>
                            <input type="text" id="loginName" class="form-control" placeholder="Name as per Documents"
                                name="name" [(ngModel)]="signUpFormValues['name']" #name="ngModel" required
                                [disabled]="disableFields" [class.is-invalid]="signUpForm.submitted && name.invalid" />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="aadharNumber">Aadhar Number</label>
                            <input type="number" id="aadharNumber" class="form-control" placeholder="12-digit number"
                                name="aadharNumber" [(ngModel)]="signUpFormValues['aadharNumber']"
                                #aadharNumber="ngModel" [disabled]="disableFields" required
                                [class.is-invalid]="signUpForm.submitted && aadharNumber.invalid"
                                pattern="^[2-9]{1}[0-9]{3}[0-9]{4}[0-9]{4}$" />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="loginMobile">Mobile Phone</label>
                            <div class="input-group">
                                <span class="input-group-text border-end-0 bg-light text-muted">+91</span>
                                <input type="number" id="loginMobile" placeholder="10-digit number" name="mobile"
                                    class="form-control" [(ngModel)]="signUpFormValues['mobile']"
                                    [disabled]="disableFields" #mobile="ngModel" required
                                    [class.is-invalid]="signUpForm.submitted && mobile.invalid" />
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="loginEmail">Email Address</label>
                            <input type="email" id="loginEmail" placeholder="email@example.com" name="mail"
                                [(ngModel)]="signUpFormValues['mail']" class="form-control" #mail="ngModel"
                                [disabled]="disableFields" required
                                [class.is-invalid]="signUpForm.submitted && mail.invalid"
                                pattern="^(?=.{1,254}$)(?=.{1,64}@)[-!#$%&'*+/0-9=?A-Z^_`a-z{|}~]+(\.[-!#$%&'*+/0-9=?A-Z^_`a-z{|}~]+)*@[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*$" />
                        </div>
                        <div class="col-md-6" *ngIf="actionType === 'create'">
                            <label class="form-label" for="loginPassword">Temporary Password</label>
                            <input type="password" id="loginPassword" required class="form-control"
                                [disabled]="disableFields" placeholder="••••••••"
                                [(ngModel)]="signUpFormValues['password']" name="password" #password="ngModel"
                                [class.is-invalid]="signUpForm.submitted && password.invalid" />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="BloodGroup">Blood Group</label>
                            <ng-select [items]="metaData['BLOOD_GROUP']" name="bloodGroup" bindLabel="label"
                                bindValue="value" required [disabled]="disableFields" placeholder="Select Group"
                                [(ngModel)]="signUpFormValues['bloodGroup']" #bloodGroup="ngModel" [clearable]="false">
                            </ng-select>
                        </div>

                        <div class="col-12">
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label class="form-label">State</label>
                                    <ng-select [items]="metaData['STATES']" bindLabel="label" bindValue="value"
                                        name="state" [disabled]="disableFields" required
                                        [(ngModel)]="signUpFormValues['state']" #state="ngModel" [clearable]="false"
                                        (ngModelChange)="changeOfState();signUpFormValues['district']=null;signUpFormValues['mandal']=null;">
                                    </ng-select>
                                </div>
                                <div class="col-md-4" *ngIf="signUpFormValues['state']">
                                    <label class="form-label">District</label>
                                    <ng-select [items]="metaData[signUpFormValues['state']+'_DISTRICTS']"
                                        bindLabel="label" bindValue="value" [disabled]="disableFields" name="district"
                                        required [(ngModel)]="signUpFormValues['district']" #district="ngModel"
                                        [clearable]="false" (ngModelChange)="signUpFormValues['mandal']=null;">
                                    </ng-select>
                                </div>
                                <div class="col-md-4" *ngIf="signUpFormValues['district']">
                                    <label class="form-label">Mandal</label>
                                    <ng-select
                                        [items]="metaData[signUpFormValues['state']+'_DISTRICT_MANDALS'][signUpFormValues['district']]"
                                        [disabled]="disableFields" name="mandal" required
                                        [(ngModel)]="signUpFormValues['mandal']" #mandal="ngModel" [clearable]="false">
                                    </ng-select>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Role</label>
                            <ng-select [items]="metaData['ROLES']" name="role" bindLabel="label" bindValue="value"
                                required [disabled]="true" [title]="'Ask Root Admin to change role'"
                                [(ngModel)]="signUpFormValues['role']" #role="ngModel" [clearable]="false">
                            </ng-select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Constituency</label>
                            <input type="text" class="form-control" placeholder="Enter Constituency" name="constituency"
                                [(ngModel)]="signUpFormValues['constituency']" required [disabled]="disableFields"
                                #constituency="ngModel"
                                [class.is-invalid]="signUpForm.submitted && constituency.invalid" />
                        </div>

                        <!-- Uploads -->
                        <div class="col-12 mt-3">
                            <div class="row g-4 text-center">
                                <div class="col-md-6">
                                    <label class="form-label d-block text-start">Profile Picture</label>
                                    <div class="image-upload-zone p-3 border rounded bg-white shadow-sm"
                                        (click)="(!disableFields && (actionType === 'create' || actionType === 'edit')) ? profilePictureUploader.click() : null"
                                        style="cursor: pointer; border: 2px dashed #e2e8f0 !important; min-height: 120px; display: flex; align-items: center; justify-content: center;">

                                        <div *ngIf="!signUpFormValues['profilePicture']" class="text-muted">
                                            <i class="fas fa-camera fa-2x mb-2 opacity-50"></i>
                                            <p class="small mb-0">Upload Photo</p>
                                        </div>

                                        <div *ngIf="signUpFormValues['profilePicture']" class="position-relative">
                                            <img [src]="signUpFormValues['profilePicture'].tempURL" class="rounded"
                                                style="width: 80px; height: 80px; object-fit: cover;">
                                            <span
                                                class="badge bg-danger position-absolute top-0 start-100 translate-middle rounded-circle"
                                                *ngIf="!disableFields && (actionType === 'create' || actionType === 'edit')"
                                                (click)="$event.stopPropagation(); removeImage('profilePicture', signUpFormValues['profilePicture'])"
                                                style="padding: 4px 6px; cursor: pointer;">
                                                <i class="fas fa-times"></i>
                                            </span>
                                        </div>
                                        <input type="file" #profilePictureUploader class="d-none"
                                            (change)="upload($event, 'profilePicture')" accept="image/*">
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label d-block text-start">Aadhar Proof</label>
                                    <div class="image-upload-zone p-3 border rounded bg-white shadow-sm"
                                        (click)="(!disableFields && (actionType === 'create' || actionType === 'edit')) ? identityProofUploader.click() : null"
                                        style="cursor: pointer; border: 2px dashed #e2e8f0 !important; min-height: 120px; display: flex; align-items: center; justify-content: center;">

                                        <div *ngIf="!signUpFormValues['identityProof']" class="text-muted">
                                            <i class="fas fa-id-card fa-2x mb-2 opacity-50"></i>
                                            <p class="small mb-0">Upload ID Card</p>
                                        </div>

                                        <div *ngIf="signUpFormValues['identityProof']" class="position-relative">
                                            <img [src]="signUpFormValues['identityProof'].tempURL" class="rounded"
                                                style="width: 140px; height: 80px; object-fit: cover;">
                                            <span
                                                class="badge bg-danger position-absolute top-0 start-100 translate-middle rounded-circle"
                                                *ngIf="!disableFields && (actionType === 'create' || actionType === 'edit')"
                                                (click)="$event.stopPropagation(); removeImage('identityProof', signUpFormValues['identityProof'])"
                                                style="padding: 4px 6px; cursor: pointer;">
                                                <i class="fas fa-times"></i>
                                            </span>
                                        </div>
                                        <input type="file" #identityProofUploader class="d-none"
                                            (change)="upload($event, 'identityProof')" accept="image/*">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer p-3 bg-light border-top">
                    <button type="button" class="btn btn-secondary border-0" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary enterprise-btn px-4"
                        [disabled]="signUpForm.invalid && !disableFields">
                        {{
                        actionType === 'create' ? 'Register Employee' :
                        actionType === 'active' ? 'Activate Account' :
                        actionType === 'inactive' ? 'Deactivate Account' :
                        actionType === 'disable' ? 'Lock Account' :
                        actionType === 'enable' ? 'Unlock Account' :
                        actionType === 'edit' ? 'Update Details' : 'Submit'
                        }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Button trigger modal -->
<button type="button" id="identityVerifactionBtn" class="btn btn-primary d-none" data-bs-toggle="modal"
    data-bs-target="#identityVerifaction">
    Add Employee
</button>

<!-- Modal -->
<div class="modal fade" id="identityVerifaction" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
    aria-labelledby="staticBackdropLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header justify-content-between">
                <h5 class="modal-title" id="staticBackdropLabel">Verify Identity</h5>
                <button type="button" class="close btn" data-bs-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <div class="col-12 row m-0 p-0">
                <div class="col-md-6">Profile Picture</div>
                <div class="col-md-6">Identity Proof</div>
                <div class="col-md-3">
                    <img class="img image-border" [src]="signUpFormValues?.profilePicture?.tempURL"
                        alt="Failed to load profile picture" style="height: 200px;" />
                    <!-- <img class="img image-border"
                        [src]="'https://drive.google.com/uc?export=view&id='+signUpFormValues.profilePicture"
                        style="height: 200px;" /> -->

                </div>
                <div class="col-md-9">
                    <img class="img w-100 image-border" [src]="signUpFormValues?.identityProof?.tempURL"
                        alt="Failed to load identity proof" />
                    <!-- <img class="img w-100 image-border"
                        [src]="'https://drive.google.com/uc?export=view&id='+signUpFormValues.identityProof" /> -->

                </div>
            </div>
            <div class="col-12 row m-0 p-0">
                <button class="btn btn-success mx-2 pull-right col"
                    (click)="updateVerification('approved')">Approve</button>
                <button class="btn btn-danger mx-2 pull-right col"
                    (click)="identityVerificationRejectionReason = 'Invalid Documents'">Reject</button>
            </div>
            <div class="col-12 row" *ngIf="identityVerificationRejectionReason">
                <span class="col">

                    <label for="">Reason for Rejection</label>
                    <input type="text" [(ngModel)]="identityVerificationRejectionReason" class="form-control"
                        placeholder="Invalid Documents" />
                </span>
                <span class="col">

                    <button class="btn btn-primary btn-sm"
                        [ngClass]="!identityVerificationRejectionReason ? 'cursor-not-allowed':''"
                        [disabled]="!identityVerificationRejectionReason"
                        (click)="updateVerification('rejected')">Submit</button>
                </span>
            </div>
        </div>
    </div>
</div>
