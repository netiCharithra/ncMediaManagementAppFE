<!doctype html>
<html lang="te" dir="ltr">

<head>
  <meta charset="utf-8">
  <!-- Viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Default title – Angular SeoService will override per-route -->
  <title>Neti Charithra – తాజా తెలుగు వార్తలు | Latest Telugu News</title>

  <!-- Default description – SeoService will override -->
  <meta name="description"
    content="Neti Charithra (నేటి చరిత్ర) – తాజా తెలుగు వార్తలు. Get the latest news from Andhra Pradesh and Telangana covering Politics, Entertainment, Sports, Technology, and Business.">

  <!-- Default keywords -->
  <meta name="keywords"
    content="Telugu news, Andhra news, Neti Charithra, నేటి చరిత్ర, Andhra Pradesh news, Telangana news, రాజకీయం, వినోదం, క్రీడలు">

  <!-- Robots -->
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">

  <!-- Canonical – SeoService injects a dynamic one per route -->
  <link rel="canonical" href="https://neticharithra.com/">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/images/logos/fullLogo.png">

  <!-- App base -->
  <base href="./">

  <!-- Google Fonts: Telugu + UI font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+Telugu:wght@400;600;700&display=swap">

  <!-- Default Open Graph -->
  <meta property="og:site_name" content="Neti Charithra">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Neti Charithra – తాజా తెలుగు వార్తలు">
  <meta property="og:description"
    content="Neti Charithra – Latest Telugu news from Andhra Pradesh and Telangana covering Politics, Entertainment, Sports, Technology and Business.">
  <meta property="og:url" content="https://neticharithra.com/">
  <meta property="og:image" content="https://neticharithra.com/assets/images/og-default.jpg">
  <meta property="og:locale" content="te_IN">
  <meta property="og:locale:alternate" content="en_IN">

  <!-- Default Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@neticharithra">
  <meta name="twitter:title" content="Neti Charithra – Latest Telugu News">
  <meta name="twitter:description" content="తాజా తెలుగు వార్తలు from Andhra Pradesh & Telangana.">
  <meta name="twitter:image" content="https://neticharithra.com/assets/images/og-default.jpg">

  <!-- Theme color for mobile browser UI -->
  <meta name="theme-color" content="#e63946">
  <meta name="msapplication-navbutton-color" content="#e63946">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Google Search Console verification (replace with your actual code) -->
