name: Angular CI/CD to Firebase Hosting # Name of your workflow

on:
  push:
    branches:
      - main_v4 # This workflow will run on pushes to the 'main' branch

jobs:
  build-and-deploy:
    name: Build & Deploy to Firebase
    runs-on: ubuntu-latest # Specify the runner environment

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 # Use the latest action to checkout your repository.

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x' # Specify the Node.js version you are using for Angular 18

      - name: Install Dependencies
        run: npm install # Install your Angular project's dependencies
  
      - name: Install Angular CLI (globally for the runner)
        run: npm install -g @angular/cli # This makes 'ng' command available
  
      - name: Build Angular App
        run: ng build --configuration production # Now 'ng' should be recognized
  

      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Deploy to Firebase
        run: firebase deploy --token "${{ secrets.FIREBASE_TOKEN }}" --only hosting
